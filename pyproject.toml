[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-audit"
version = "0.1.1"
description = "Comprehensive domain health auditing tool — DNS, SSL, WHOIS, headers, ports, email security, and tech detection with actionable grades."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "domain-audit contributors" },
]
keywords = ["dns", "ssl", "security", "domain", "audit", "whois", "dmarc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Operating System :: OS Independent",
]

dependencies = [
    "dnspython>=2.4",
    "httpx>=0.27",
    "python-whois>=0.9",
    "cryptography>=41.0",
    "rich>=12.4,<15",
    "mcp[cli]>=1.0",
]

[project.urls]
Homepage = "https://github.com/Opticsponge/domain-audit"
Repository = "https://github.com/Opticsponge/domain-audit"
"Bug Tracker" = "https://github.com/Opticsponge/domain-audit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "build>=1.0",
    "twine>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
domain-audit = "domain_audit.cli:main"
domain-audit-mcp = "domain_audit.mcp_server:main"

[tool.setuptools.packages.find]
include = ["domain_audit*"]

[tool.setuptools.package-data]
domain_audit = ["py.typed", "scanners/tech_patterns/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["mcp.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["domain_audit.scanners.subdomains"]
disable_error_code = ["union-attr", "arg-type", "misc", "dict-item"]
